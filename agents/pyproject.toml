[project]
name = "agents"
version = "0.1.0"
description = "FastAPI backend for the AI agent platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ag-ui-protocol>=0.1.10",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "logfire[fastapi,httpx]>=5.2.0",
    "pydantic-ai-slim[ag-ui,openai,spec]>=1.0.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "app"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["app"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
extraPaths = ["src", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
